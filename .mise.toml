[tools]
python = "3.14"
go     = "1.27"
node   = "24"
uv     = "0.12.19"
bun    = "1.4.2"
cmake  = "4.4.3"

[tasks.gen-fixtures]
description = "Fetch golden vectors from the AlAdhan API (manual / scheduled drift job — NOT in CI)"
run = "python3 scripts/generate_fixtures.py"

[tasks.sync-data]
description = "Copy shared/methods.json into each language tree (committed copies)"
run = "python3 scripts/sync_data.py"

[tasks.test-python]
dir = "langs/python"
run = "uv run pytest"

[tasks.test-go]
dir = "langs/go"
run = "go test ./..."

[tasks.test-ts]
dir = "langs/typescript"
run = "bun test"

[tasks.test-c]
dir = "langs/c"
run = "cmake -B build && cmake --build build && ctest --test-dir build --output-on-failure"

[tasks.test]
depends = ["test-python", "test-go", "test-ts", "test-c"]

[tasks.parity]
description = "Cross-language float parity (≤1e-9 hours)"
run = "python3 tests/parity.py"

[tasks.lint]
run = "uv run --project langs/python ruff check langs/python && gofmt -l langs/go && bun x tsc -p langs/typescript/tsconfig.json --noEmit"

[tasks.ci]
run = "mise run test && mise run parity && mise run lint"
