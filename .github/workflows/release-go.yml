name: Release Go (module tag)

# Triggered by a `langs/go/vX.Y.Z` tag. The tag prefix must be the module path so
# proxy.golang.org can serve semver versions of the submodule (the Go module is
# published by the tag alone); this workflow verifies the module is consumable at
# that tag and files a GitHub Release.
# Go has no version file — `mise run bump go X.Y.Z` is a no-op by design.

on:
  push:
    tags:
      - "langs/go/v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
    steps:
      - uses: actions/checkout@v7

      - name: Install tools (mise)
        uses: jdx/mise-action@v4

      - name: Install C toolchain (parity harness builds the C kernel)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install TypeScript deps
        working-directory: langs/typescript
        run: bun install --frozen-lockfile

      - name: Parse version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#langs/go/v}" >> "$GITHUB_OUTPUT"

      - name: Verify — full repo green before releasing
        run: mise run ci

      - name: Confirm the module resolves at langs/go/vX.Y.Z from a clean consumer
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          go mod init example.com/releasecheck
          # For the submodule, version vN maps to tag langs/go/vN; the proxy resolves it.
          GOPROXY=https://proxy.golang.org,direct go get "github.com/yasn77/salahlib/langs/go@v${{ steps.ver.outputs.version }}" || {
            echo "::warning::proxy.golang.org had not indexed the tag yet (can take a few minutes)."
            echo "::warning::Re-check manually: go get github.com/yasn77/salahlib/langs/go@v${{ steps.ver.outputs.version }}"
            exit 0
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
